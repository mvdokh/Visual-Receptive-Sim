  <circle cx="728" cy="552" r="30" fill="#1a3a58" stroke="#5ba8d4" stroke-width="2.5" opacity="0.9"/>
  <circle cx="728" cy="552" r="15" fill="#0d1e30" opacity="0.85"/>

  <!-- Iris -->
  <circle cx="512" cy="512" r="118" fill="none" stroke="#1e6fa0" stroke-width="3" opacity="0.7"/>
  <g opacity="0.3" stroke="#2a90c8" stroke-width="1.2" fill="none">
    <path d="M512 394 Q538 424 538 512 Q538 600 512 630"/>
    <path d="M512 394 Q486 424 486 512 Q486 600 512 630"/>
    <path d="M394 512 Q424 534 512 534 Q600 534 630 512"/>
    <path d="M394 512 Q424 490 512 490 Q600 490 630 512"/>
    <path d="M420 432 Q460 468 512 476 Q564 468 604 432"/>
    <path d="M420 592 Q460 556 512 548 Q564 556 604 592"/>
