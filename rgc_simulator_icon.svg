  <g opacity="0.35" stroke="#5ba8d4" stroke-width="2" fill="none">
    <path d="M512 512 Q540 528 604 544 Q656 556 718 558"/>
    <path d="M512 512 Q540 526 606 538 Q660 548 720 549"/>
    <path d="M512 512 Q541 524 608 532 Q664 540 724 540"/>
    <path d="M512 512 Q539 530 602 550 Q654 562 716 564"/>
