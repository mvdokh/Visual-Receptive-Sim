  <circle cx="530" cy="530" r="5.5" fill="#fff" opacity="0.35"/>

  <!-- Center RGC soma -->
  <circle cx="512" cy="512" r="15" fill="#00e8c6" filter="url(#soft-glow)"/>

  <!-- Receptive field rings -->
  <circle cx="512" cy="512" r="165" fill="none" stroke="#1e4a6a" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="512" cy="512" r="222" fill="none" stroke="#153a55" stroke-width="1.2" stroke-dasharray="6 11" opacity="0.4"/>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="none" stroke="#1e4a70" stroke-width="4"/>
</svg>
