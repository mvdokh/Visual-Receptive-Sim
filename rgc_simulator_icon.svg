<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>RGC Simulator Icon</title>
  <desc>App icon featuring a stylized eye with retinal ganglion cell network on deep indigo background</desc>
  <defs>
    <clipPath id="circle-clip">
      <circle cx="512" cy="512" r="400"/>
    </clipPath>
    <radialGradient id="iris-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ff4d4" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0aa8c0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a2a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2d50"/>
      <stop offset="100%" stop-color="#080f1e"/>
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e8c6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e8c6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg-grad)"/>
  <circle cx="512" cy="512" r="410" fill="url(#iris-grad)"/>

  <!-- Ganglion cell network -->
  <g clip-path="url(#circle-clip)" opacity="0.55" stroke="#00c8a8" stroke-width="1.5" fill="none">
    <path d="M512 512 Q604 408 678 318"/>
    <path d="M512 512 Q624 452 715 398"/>
    <path d="M512 512 Q614 506 700 490"/>
    <path d="M512 512 Q560 390 578 294"/>
    <path d="M512 512 Q420 408 346 318"/>
    <path d="M512 512 Q400 452 309 398"/>
    <path d="M512 512 Q410 506 324 490"/>
    <path d="M512 512 Q464 390 446 294"/>
    <path d="M512 512 Q554 624 602 706"/>
    <path d="M512 512 Q512 634 512 736"/>
    <path d="M512 512 Q470 624 422 706"/>
    <path d="M512 512 Q592 588 678 624"/>
    <path d="M512 512 Q432 588 346 624"/>
    <path d="M678 318 Q722 292 748 264"/>
    <path d="M715 398 Q770 378 805 350"/>
    <path d="M346 318 Q302 292 276 264"/>
    <path d="M309 398 Q254 378 219 350"/>
    <path d="M602 706 Q618 762 632 796"/>
    <path d="M422 706 Q406 762 392 796"/>
    <path d="M512 736 Q509 786 506 820"/>
    <path d="M678 624 Q734 634 774 616"/>
    <path d="M346 624 Q290 634 250 616"/>
