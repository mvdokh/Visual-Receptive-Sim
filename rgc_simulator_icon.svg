    <circle cx="715" cy="398" r="8.5" fill="#00e8c6"/>
    <circle cx="700" cy="490" r="7.5" fill="#00cfb4"/>
    <circle cx="578" cy="294" r="7.5" fill="#00e8c6"/>
    <circle cx="346" cy="318" r="9" fill="#00e8c6"/>
    <circle cx="309" cy="398" r="8.5" fill="#00e8c6"/>
    <circle cx="324" cy="490" r="7.5" fill="#00cfb4"/>
    <circle cx="446" cy="294" r="7.5" fill="#00e8c6"/>
    <circle cx="602" cy="706" r="8.5" fill="#00e8c6"/>
    <circle cx="512" cy="736" r="9" fill="#00e8c6"/>
    <circle cx="422" cy="706" r="8.5" fill="#00e8c6"/>
    <circle cx="678" cy="624" r="7.5" fill="#00cfb4"/>
    <circle cx="346" cy="624" r="7.5" fill="#00cfb4"/>
    <circle cx="748" cy="264" r="6" fill="#00e8c6" opacity="0.7"/>
    <circle cx="805" cy="350" r="6" fill="#00e8c6" opacity="0.7"/>
    <circle cx="276" cy="264" r="6" fill="#00e8c6" opacity="0.7"/>
    <circle cx="219" cy="350" r="6" fill="#00e8c6" opacity="0.7"/>
    <circle cx="632" cy="796" r="6" fill="#00e8c6" opacity="0.7"/>
    <circle cx="392" cy="796" r="6" fill="#00e8c6" opacity="0.7"/>
    <circle cx="506" cy="820" r="6" fill="#00e8c6" opacity="0.7"/>
    <circle cx="774" cy="616" r="6" fill="#00e8c6" opacity="0.7"/>
