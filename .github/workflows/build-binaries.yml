name: Build Binaries And Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Build package
        run: |
          python packaging/build.py --clean

      - name: Collect release files
        shell: bash
        run: |
          python - <<'PY'
          import platform
          import shutil
          from pathlib import Path

          dist_root = Path("packaging/dist")
          release_assets = Path("release_assets")
          release_assets.mkdir(parents=True, exist_ok=True)

          system = platform.system().lower()
          if system == "darwin":
              patterns = ["macos/*.dmg"]
          elif system == "windows":
              patterns = ["windows/*.exe"]
          elif system == "linux":
              patterns = ["linux/*.tar.gz"]
          else:
              raise SystemExit(f"Unsupported platform: {system}")

          copied = []
          for pattern in patterns:
              for src in dist_root.glob(pattern):
                  if src.is_file():
                      dst = release_assets / src.name
                      shutil.copy2(src, dst)
                      copied.append(str(dst))

          if not copied:
              raise SystemExit(f"No release assets found for {system} in {dist_root}")

          print("Release assets:")
          for item in copied:
              print("-", item)
          PY

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: release_assets/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release_assets

      - name: Compute release metadata
        id: meta
        run: |
          echo "tag=auto-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "name=Auto Build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            release_assets/*
